[tool.pytest.ini_options]
testpaths = ["src/test"]
pythonpath = [".", "src"]
# TODO: plocka tillbaka igen så fort jag kan få upp kval igen efter llamaindex-införandet 
# addopts = "--cov=src/main --cov-report=term-missing --cov-fail-under=70"

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["src/main/all_articles"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
